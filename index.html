<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a1a">
<title>KBL｜SION.J株式会社</title>
<style>
  :root{
    --bg: #f5f4f1;
    --card: #ffffff;
    --ink: #1c2027;
    --ink-soft: #565d68;
    --line: #e2e0da;
    --accent: #d9770b;
    --accent-dark: #a85a06;
    --navy: #1a1a1a;
    --ok: #2f7d5a;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  header{
    background:var(--navy);
    color:#fff;
    padding:18px 20px 16px;
    position:sticky; top:0; z-index:10;
  }
  header .title{
    font-size:19px;
    font-weight:700;
    letter-spacing:.01em;
  }
  header .sub{
    font-size:12.5px;
    color:#b9c0cd;
    margin-top:3px;
  }
  main{
    padding:16px 16px 100px;
    max-width:520px;
    margin:0 auto;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 16px;
    margin-bottom:14px;
  }
  label{
    display:block;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:7px;
  }
  .req{ color:var(--accent); font-weight:700; margin-left:2px; }
  select, textarea, input[type=file]{
    width:100%;
    font-size:16px;
    padding:12px 12px;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:#fff;
    color:var(--ink);
    font-family:inherit;
  }
  select:focus, textarea:focus{
    outline:none;
    border-color:var(--accent);
  }
  textarea{
    min-height:96px;
    resize:vertical;
  }
  .field{ margin-bottom:16px; }
  .field:last-child{ margin-bottom:0; }
  .status-group{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .status-btn{
    flex:1 1 auto;
    min-width:70px;
    text-align:center;
    padding:12px 4px;
    border:1.5px solid var(--line);
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    color:var(--ink-soft);
    background:#fff;
    cursor:pointer;
  }
  .status-btn.active{ background:#fdf1e2; border-color:var(--accent); color:var(--accent-dark); }
  .photo-box{
    display:flex;
    align-items:center;
    justify-content:center;
    width:56px; height:56px;
    border-radius:8px;
    border:1.5px dashed #b9b6ac;
    color:#9a978d;
    cursor:pointer;
  }
  .photo-preview{
    margin-top:10px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .photo-preview img{
    width:72px; height:72px;
    object-fit:cover;
    border-radius:8px;
    border:1px solid var(--line);
  }
  .hint{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .submit-bar{
    position:fixed;
    bottom:0; left:0; right:0;
    background:linear-gradient(to top, var(--bg) 60%, transparent);
    padding:16px 16px 18px;
  }
  .submit-bar-inner{ max-width:520px; margin:0 auto; }
  button#submitBtn{
    width:100%;
    padding:16px;
    font-size:16.5px;
    font-weight:700;
    color:#fff;
    background:var(--accent);
    border:none;
    border-radius:12px;
    cursor:pointer;
  }
  button#submitBtn:disabled{ background:#c9ccd1; }
  button#submitBtn:active:not(:disabled){ background:var(--accent-dark); }
  #statusMsg{
    text-align:center;
    font-size:13.5px;
    margin-top:10px;
    min-height:18px;
  }
  #statusMsg.ok{ color:var(--ok); font-weight:600; }
  #statusMsg.err{ color:#b3261e; font-weight:600; }
  .done-screen{
    text-align:center;
    padding:60px 20px;
  }
  .done-screen .check{
    width:64px; height:64px;
    border-radius:50%;
    background:var(--ok);
    color:#fff;
    font-size:32px;
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 18px;
  }
  .done-screen h2{ font-size:18px; margin:0 0 8px; }
  .done-screen p{ color:var(--ink-soft); font-size:14px; margin:0 0 26px; }
  .done-screen button{
    padding:12px 26px;
    border:1.5px solid var(--line);
    background:#fff;
    border-radius:10px;
    font-size:14.5px;
    font-weight:600;
    color:var(--ink);
  }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<header>
  <div class="title">SION.J株式会社 <span style="font-size:11px; font-weight:600; color:#d9770b; border:1px solid #d9770b; border-radius:5px; padding:1px 6px; vertical-align:middle; margin-left:4px;">KBL</span></div>
  <div class="sub" id="todayLabel"></div>
</header>

<main>
  <div id="formScreen">
    <div class="card">
      <div class="field">
        <label>お名前<span class="req">必須</span></label>
        <select id="workerSelect">
          <option value="">選択してください</option>
        </select>
      </div>
      <div class="field">
        <label>現場<span class="req">必須</span></label>
        <select id="siteSelect">
          <option value="">選択してください</option>
        </select>
      </div>
      <div class="field">
        <label>工程<span class="req">必須</span></label>
        <div class="status-group" id="statusGroup">
          <div class="hint" id="statusPlaceholder">現場を選ぶと工程が表示されます</div>
        </div>
      </div>
      <div class="field">
        <label>作業内容<span class="req">必須</span></label>
        <textarea id="content" placeholder="今日やった作業を簡単に入力してください"></textarea>
      </div>
      <div class="field">
        <label>写真（任意）</label>
        <label class="photo-box" for="photoInput">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="14" r="3.4"/></svg>
        </label>
        <input type="file" id="photoInput" accept="image/*" capture="environment" multiple class="hidden">
        <div class="photo-preview" id="photoPreview"></div>
        <div class="hint">現場写真があれば添付してください（なくても送信できます）</div>
      </div>
    </div>
  </div>

  <div id="doneScreen" class="done-screen hidden">
    <div class="check">✓</div>
    <h2>報告を送信しました</h2>
    <p id="doneDetail"></p>
    <button id="againBtn">続けてもう1件報告する</button>
  </div>
</main>

<div class="submit-bar" id="submitBar">
  <div class="submit-bar-inner">
    <button id="submitBtn">この内容で報告する</button>
    <div id="statusMsg"></div>
  </div>
</div>

<script>
// ==== 設定：GASのWebアプリURLに差し替えてください ====
const GAS_URL = "https://script.google.com/macros/s/AKfycbyuABcVJ-tPZZc9NIKWx_PrxY4X-SkHdoR4taTJDPKSDc2wqGPjwADnp8TBfatkzqaNfg/exec";

// ==== プッシュ通知設定（Cloudflare Workerデプロイ後に書き換える） ====
const PUSH_WORKER_URL = "★ここにCloudflare WorkerのURLを貼る（例: https://kbl-push.xxxx.workers.dev）★";
const VAPID_PUBLIC_KEY = "BAXKJwcvLvHDgNmajXGtnaDXA0Nf2I5BfOdMA4CVCXCOZfL9xSs9HSG2I-IL9WHp2G08aJKkj-NwhhDXRwyKjRk";

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function setupPush(workerName) {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  if (!PUSH_WORKER_URL || PUSH_WORKER_URL.indexOf('★') !== -1) return; // 未設定なら何もしない

  try {
    const reg = await navigator.serviceWorker.register('sw.js');
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return;

    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }

    await fetch(PUSH_WORKER_URL + '/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ worker: workerName, subscription: sub })
    });
  } catch (err) {
    console.warn('push setup failed', err);
  }
}

// 現場・職人はいずれもスプレッドシートのマスタから取得する
let SITES = [];

let selectedStage = null; // { number, name }
let photos = []; // {name, base64}

const todayLabel = document.getElementById('todayLabel');
const now = new Date();
todayLabel.textContent = '電工日報　' + now.toLocaleDateString('ja-JP', { month:'long', day:'numeric', weekday:'short' });

// 職人名プルダウン生成（職人マスタシートから取得）
const workerSelect = document.getElementById('workerSelect');
function loadWorkers(){
  workerSelect.innerHTML = '<option value="">読み込み中...</option>';
  fetch(GAS_URL + '?action=workers')
    .then(r => r.json())
    .then(data => {
      const workers = data.workers || [];
      workerSelect.innerHTML = '<option value="">選択してください</option>';
      workers.forEach(w => {
        const opt = document.createElement('option');
        opt.value = w; opt.textContent = w;
        workerSelect.appendChild(opt);
      });
    })
    .catch(() => {
      workerSelect.innerHTML = '<option value="">職人一覧の取得に失敗しました</option>';
    });
}
loadWorkers();
workerSelect.addEventListener('change', () => {
  if (workerSelect.value) setupPush(workerSelect.value);
});

// 現場マスタ取得（GASのdoGetから）
const siteSelect = document.getElementById('siteSelect');
function loadSites(){
  siteSelect.innerHTML = '<option value="">読み込み中...</option>';
  fetch(GAS_URL + '?action=sites')
    .then(r => r.json())
    .then(data => {
      SITES = data.sites || [];
      siteSelect.innerHTML = '<option value="">選択してください</option>';
      SITES.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id; opt.textContent = s.name;
        siteSelect.appendChild(opt);
      });
    })
    .catch(() => {
      siteSelect.innerHTML = '<option value="">現場一覧の取得に失敗しました</option>';
    });
}
loadSites();

// 現場を選んだら、その現場の工程一覧を取得して工程ボタンを描画
const statusGroup = document.getElementById('statusGroup');
siteSelect.addEventListener('change', () => {
  const siteId = siteSelect.value;
  selectedStage = null;
  if(!siteId){
    statusGroup.innerHTML = '<div class="hint">現場を選ぶと工程が表示されます</div>';
    return;
  }
  statusGroup.innerHTML = '<div class="hint">工程を読み込み中...</div>';
  fetch(GAS_URL + '?action=milestones&siteId=' + encodeURIComponent(siteId))
    .then(r => r.json())
    .then(data => {
      const milestones = data.milestones || [];
      if(milestones.length === 0){
        statusGroup.innerHTML = '<div class="hint">この現場には工程が登録されていません</div>';
        return;
      }
      statusGroup.innerHTML = '';
      milestones.forEach(m => {
        const btn = document.createElement('div');
        btn.className = 'status-btn';
        btn.textContent = m.name;
        btn.dataset.number = m.number;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedStage = { number: m.number, name: m.name };
        });
        statusGroup.appendChild(btn);
      });
    })
    .catch(() => {
      statusGroup.innerHTML = '<div class="hint">工程一覧の取得に失敗しました</div>';
    });
});

// 写真プレビュー
const photoInput = document.getElementById('photoInput');
const photoPreview = document.getElementById('photoPreview');
photoInput.addEventListener('change', () => {
  photos = [];
  photoPreview.innerHTML = '';
  const files = Array.from(photoInput.files).slice(0, 3); // PoCでは最大3枚
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      photos.push({ name: file.name, base64: e.target.result.split(',')[1], mimeType: file.type });
      const img = document.createElement('img');
      img.src = e.target.result;
      photoPreview.appendChild(img);
    };
    reader.readAsDataURL(file);
  });
});

const submitBtn = document.getElementById('submitBtn');
const statusMsg = document.getElementById('statusMsg');

submitBtn.addEventListener('click', () => {
  const worker = workerSelect.value;
  const siteId = siteSelect.value;
  const siteName = siteSelect.options[siteSelect.selectedIndex]?.textContent || '';
  const content = document.getElementById('content').value.trim();

  if(!worker){ showMsg('お名前を選択してください', true); return; }
  if(!siteId){ showMsg('現場を選択してください', true); return; }
  if(!selectedStage){ showMsg('工程を選択してください', true); return; }
  if(!content){ showMsg('作業内容を入力してください', true); return; }

  submitBtn.disabled = true;
  showMsg('送信中...', false);

  const payload = {
    worker, siteId, siteName,
    stageNumber: selectedStage.number,
    stageName: selectedStage.name,
    content,
    photos
  };

  fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' }, // GAS側の制約を回避するためtext/plainで送りJSON文字列を渡す
    body: JSON.stringify(payload)
  })
  .then(r => r.json())
  .then(res => {
    if(res.result === 'ok'){
      document.getElementById('doneDetail').textContent = `${siteName} / ${selectedStage.name} で報告しました`;
      document.getElementById('formScreen').classList.add('hidden');
      document.getElementById('submitBar').classList.add('hidden');
      document.getElementById('doneScreen').classList.remove('hidden');
    } else {
      showMsg('送信に失敗しました。もう一度お試しください', true);
    }
  })
  .catch(() => showMsg('通信エラーが発生しました', true))
  .finally(() => { submitBtn.disabled = false; });
});

document.getElementById('againBtn').addEventListener('click', () => {
  document.getElementById('content').value = '';
  photoInput.value = '';
  photoPreview.innerHTML = '';
  photos = [];
  selectedStage = null;
  siteSelect.value = '';
  statusGroup.innerHTML = '<div class="hint">現場を選ぶと工程が表示されます</div>';
  statusMsg.textContent = '';
  document.getElementById('doneScreen').classList.add('hidden');
  document.getElementById('formScreen').classList.remove('hidden');
  document.getElementById('submitBar').classList.remove('hidden');
});

function showMsg(text, isErr){
  statusMsg.textContent = text;
  statusMsg.className = isErr ? 'err' : '';
}
</script>
</body>
</html>
